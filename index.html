<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>離席時間紀錄器 | 자리 비움 기록기</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#202637;background:#f7f8fb}*{box-sizing:border-box}body{margin:0;padding:24px 16px}main{max-width:990px;margin:auto}header,.bar,.actions,.filters{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{margin-bottom:24px}h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}.muted{color:#6c7485;font-size:13px}.panel{background:white;border:1px solid #e6e9f0;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 2px 12px #10182806}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px}.action{border:2px solid transparent;border-radius:14px;min-height:110px;font-weight:750;font-size:21px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.action small{font-weight:400;font-size:13px}.toilet{background:#e7f1ff;color:#1858ad}.chat{background:#fff1e2;color:#935316}.action.active{border-color:currentColor}.action:disabled{opacity:.45;cursor:not-allowed}.stop{background:#222b43;color:white;font-size:17px;border:none;border-radius:12px;padding:14px 22px;cursor:pointer}.stop:disabled{background:#b8bfcb;cursor:not-allowed}.timer{font-size:43px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:9px 0}.state{font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#f8f9fc;border-radius:12px;padding:16px}.card .number{font-size:23px;font-weight:750;margin:7px 0}.split{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:8px}.pill{padding:4px 8px;border-radius:20px;font-size:12px;font-weight:700}.pill.toilet{background:#e7f1ff}.pill.chat{background:#fff1e2}select,input,button.ghost{border:1px solid #d9deea;border-radius:9px;padding:9px 11px;background:#fff;color:#263247;font:inherit}button.ghost{cursor:pointer}button.ghost.danger{color:#b0232d}button.ghost:disabled{opacity:.4;cursor:not-allowed}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid #ecedf2;white-space:nowrap}th{color:#6d7586;font-weight:600;font-size:12px}td button{margin-right:4px}.empty{text-align:center;padding:30px 10px;color:#8790a1}.foot{line-height:1.7}.monthbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20283c;color:#fff;padding:11px 18px;border-radius:10px;display:none;z-index:3}.toast.visible{display:block}.barline{height:11px;background:#fff1e2;border-radius:8px;overflow:hidden;margin:9px 0}.barline>div{height:100%;background:#79a8ed;width:0%}@media(max-width:650px){body{padding:15px 10px}.panel{padding:16px}.cards{grid-template-columns:1fr}.buttons{gap:9px}.action{font-size:17px;min-height:100px}.timer{font-size:36px}h1{font-size:22px}}
</style>
</head>
<body><main>
<header><div><h1 data-i="title">離席時間紀錄器</h1><div class="muted" data-i="subtitle">按一下開始，再按「返回」結束；分開累計廁所與聊天時間。</div></div><select id="language" aria-label="language"><option value="zh">繁體中文</option><option value="ko">한국어</option></select></header>
<section class="panel"><div class="bar"><h2 data-i="control">快速記錄</h2><span class="muted" id="clock"></span></div><div class="buttons"><button class="action toilet" id="startAway"><span>⏱️ <span data-i="away">離席</span></span><small data-i="start">點擊開始計時</small></button></div><div style="text-align:center;padding-top:20px"><div class="state" id="stateLabel"></div><div class="timer" id="timer">00:00:00</div><button id="stop" class="stop" data-i="back">返回座位・停止計時</button><p class="muted" data-i="activeNotice">同一時間只能記錄一個類別。切換前請先結束目前計時。</p></div></section>
<section class="panel"><div class="bar"><h2 data-i="summary">累計統計</h2><span class="muted" data-i="includeLive">進行中的計時也包含在統計內</span></div><div class="cards" id="cards"></div></section>
<section class="panel"><div class="bar"><h2 data-i="history">詳細紀錄</h2><div class="filters"><input type="month" id="month" aria-label="month"></div></div><div class="tablewrap"><table><thead><tr><th data-i="date">日期</th><th data-i="from">開始</th><th data-i="to">結束</th><th data-i="duration">時長</th><th data-i="manage">管理</th></tr></thead><tbody id="rows"></tbody></table></div><div class="bar" style="margin-top:16px"><span class="muted" id="count"></span><div class="actions"><button class="ghost" id="exportCsv" data-i="csv">匯出 CSV</button><button class="ghost" id="exportJson" data-i="backup">備份資料</button><button class="ghost" id="importJson" data-i="restore">還原備份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></div></section>
<section class="panel foot"><div class="muted" data-i="disclaimer">資料只保存在這個瀏覽器中，不會自動上傳或同步。清除瀏覽器資料可能造成紀錄遺失，建議定期備份。這是手動觀察紀錄，不代表實際工作狀態；請避免用來推斷同事的工作表現。</div></section>
</main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='seat-tracker-v1',LANG='seat-tracker-lang';
const dict={zh:{title:'離席時間紀錄器',subtitle:'按一下開始，再按「返回」結束；分開累計廁所與聊天時間。',control:'快速記錄',toilet:'上廁所',chat:'聊天',start:'點擊開始計時',back:'返回座位・停止計時',activeNotice:'同一時間只能記錄一個類別。切換前請先結束目前計時。',summary:'累計統計',includeLive:'進行中的計時也包含在統計內',history:'詳細紀錄',all:'全部類別',date:'日期',type:'類別',from:'開始',to:'結束',duration:'時長',manage:'管理',csv:'匯出 CSV',backup:'備份資料',restore:'還原備份',disclaimer:'資料只保存在這個瀏覽器中，不會自動上傳或同步。清除瀏覽器資料可能造成紀錄遺失，建議定期備份。這是手動觀察紀錄，不代表實際工作狀態；請避免用來推斷同事的工作表現。',today:'今天',month:'本月',total:'全部期間',count:'次數',idle:'目前沒有計時',running:'正在計時',delete:'刪除',edit:'修改',empty:'本月沒有符合條件的紀錄',confirmDel:'確定刪除這筆紀錄？',editStart:'修改開始時間 (YYYY-MM-DDTHH:mm)',editEnd:'修改結束時間 (YYYY-MM-DDTHH:mm)',invalid:'時間格式不正確，或結束時間未晚於開始時間',saved:'已儲存',started:'已開始計時',stopped:'已結束並記錄',already:'已在計時中',noActive:'目前沒有進行中的計時',restoreConfirm:'還原備份將覆蓋現有資料。確定嗎？',restoreError:'備份格式無效',restoreSuccess:'資料已還原',totalCount:'顯示筆數',daySplit:'按天拆分（跨午夜自動分配）'},ko:{title:'자리 비움 기록기',subtitle:'버튼으로 시작하고 복귀 버튼으로 종료하세요. 화장실과 잡담 시간을 별도로 합산합니다.',control:'빠른 기록',toilet:'화장실',chat:'잡담',start:'눌러서 측정 시작',back:'자리 복귀 · 측정 종료',activeNotice:'한 번에 한 종류만 측정할 수 있습니다. 다른 종류를 시작하려면 먼저 종료하세요.',summary:'누적 통계',includeLive:'측정 중인 시간도 통계에 포함됩니다',history:'상세 기록',all:'전체 유형',date:'날짜',type:'유형',from:'시작',to:'종료',duration:'소요 시간',manage:'관리',csv:'CSV 내보내기',backup:'데이터 백업',restore:'백업 복원',disclaimer:'데이터는 이 브라우저에만 저장되며 자동 동기화되지 않습니다. 브라우저 데이터를 삭제하면 기록이 사라질 수 있으니 주기적으로 백업하세요. 수동 관찰 기록은 실제 근무 상태나 업무 성과를 의미하지 않습니다.',today:'오늘',month:'이번 달',total:'전체 기간',count:'횟수',idle:'현재 측정 중이 아님',running:'측정 중',delete:'삭제',edit:'수정',empty:'이번 달에 해당하는 기록이 없습니다',confirmDel:'이 기록을 삭제할까요?',editStart:'시작 시간 수정 (YYYY-MM-DDTHH:mm)',editEnd:'종료 시간 수정 (YYYY-MM-DDTHH:mm)',invalid:'시간 형식이 잘못됐거나 종료가 시작보다 빠릅니다',saved:'저장됨',started:'측정 시작',stopped:'측정 종료 및 저장 완료',already:'이미 측정 중입니다',noActive:'측정 중인 항목이 없습니다',restoreConfirm:'백업을 복원하면 현재 데이터가 덮어쓰기 됩니다. 계속할까요?',restoreError:'백업 파일 형식이 올바르지 않습니다',restoreSuccess:'복원 완료',totalCount:'표시 건수',daySplit:'날짜 경계에 맞춰 시간 분할'}};
dict.zh.away='離席';dict.ko.away='자리이탈';dict.zh.subtitle='按一下開始離席計時，返回座位時結束。';dict.ko.subtitle='자리이탈 버튼으로 시작하고 복귀 버튼으로 종료하세요.';dict.zh.activeNotice='每次只能記錄一段離席時間。';dict.ko.activeNotice='한 번에 하나의 자리이탈 시간만 기록합니다.';
let lang=localStorage.getItem(LANG)==='ko'?'ko':'zh';let db=load();db.records=db.records.map(r=>({...r,kind:'away'}));if(db.active)db.active.kind='away';save();
const $=id=>document.getElementById(id),t=k=>dict[lang][k],pad=n=>String(n).padStart(2,'0');
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.records))return {records:v.records.filter(valid),active:validActive(v.active)?v.active:null};}catch(e){}return {records:[],active:null}}
function valid(r){return r&&typeof r.id==='string'&&['toilet','chat','away'].includes(r.kind)&&Number.isFinite(r.start)&&Number.isFinite(r.end)&&r.end>r.start}
function validActive(a){return a&&['toilet','chat','away'].includes(a.kind)&&Number.isFinite(a.start)&&a.start>0}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function fmtTime(n){let s=Math.max(0,Math.floor(n/1000));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
function shortTime(n){const s=Math.max(0,Math.floor(n/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return lang==='zh'?`${h}小時 ${m}分`: `${h}시간 ${m}분`}
function ymd(ts){const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function localDateTime(ts){const d=new Date(ts);return `${ymd(ts)}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function hhmm(ts){const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function allRecords(){const a=db.records.slice();if(db.active)a.push({id:'live',kind:db.active.kind,start:db.active.start,end:Date.now(),live:true});return a}
function sumBetween(records,start,end){const out={away:0,count:0};for(const r of records){const amount=Math.max(0,Math.min(r.end,end)-Math.max(r.start,start));if(amount>0){out.away+=amount;out.count++}}return out}
function boundaries(){const now=new Date(),dayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),monStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();return [dayStart,monStart]}
function showToast(s){const el=$('toast');el.textContent=s;el.classList.add('visible');clearTimeout(showToast.timeout);showToast.timeout=setTimeout(()=>el.classList.remove('visible'),2300)}
function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':'ko';document.title=t('title');$('language').value=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));const active=db.active,now=Date.now();$('clock').textContent=new Date(now).toLocaleString(lang==='zh'?'zh-TW':'ko-KR');$('stateLabel').textContent=active?`${t('away')} · ${t('running')}`:t('idle');$('timer').textContent=active?fmtTime(now-active.start):'00:00:00';$('startAway').disabled=!!active;$('stop').disabled=!active;$('startAway').classList.toggle('active',!!active);const recs=allRecords(),[ds,ms]=boundaries(),periods=[[t('today'),ds,now],[t('month'),ms,now],[t('total'),-Infinity,now]];$('cards').replaceChildren(...periods.map(([label,s,e])=>{const o=sumBetween(recs,s,e),card=document.createElement('div');card.className='card';card.innerHTML=`<div class="muted">${label}</div><div class="number">${shortTime(o.away)}</div><div class="split muted"><span>${t('count')}</span><span>${o.count}</span></div>`;return card}));renderRows()}
function renderRows(){const month=$('month').value,recs=db.records.filter(r=>ymd(r.start).startsWith(month)).sort((a,b)=>b.start-a.start);const body=$('rows');body.replaceChildren();for(const r of recs){const tr=document.createElement('tr');const cells=[ymd(r.start),hhmm(r.start),hhmm(r.end),fmtTime(r.end-r.start)];for(const value of cells){const td=document.createElement('td');td.textContent=value;tr.append(td)}const td=document.createElement('td');const edit=document.createElement('button');edit.className='ghost';edit.textContent=t('edit');edit.onclick=()=>editRecord(r.id);const del=document.createElement('button');del.className='ghost danger';del.textContent=t('delete');del.onclick=()=>deleteRecord(r.id);td.append(edit,del);tr.append(td);body.append(tr)}if(!recs.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.className='empty';td.textContent=t('empty');tr.append(td);body.append(tr)}$('count').textContent=`${t('totalCount')}: ${recs.length}`}
function start(){if(db.active)return showToast(t('already'));db.active={kind:'away',start:Date.now()};save();render();showToast(t('started'))}
function stop(){if(!db.active)return showToast(t('noActive'));const a=db.active;const end=Date.now();if(end>a.start)db.records.push({id:crypto.randomUUID?crypto.randomUUID():String(end)+Math.random(),kind:'away',start:a.start,end});db.active=null;save();render();showToast(t('stopped'))}
function deleteRecord(id){if(!confirm(t('confirmDel')))return;db.records=db.records.filter(r=>r.id!==id);save();render()}
function editRecord(id){const r=db.records.find(r=>r.id===id);if(!r)return;const s=prompt(t('editStart'),localDateTime(r.start));if(s===null)return;const e=prompt(t('editEnd'),localDateTime(r.end));if(e===null)return;const ns=new Date(s).getTime(),ne=new Date(e).getTime();if(!Number.isFinite(ns)||!Number.isFinite(ne)||ne<=ns)return alert(t('invalid'));r.start=ns;r.end=ne;save();render();showToast(t('saved'))}
function download(filename,data,mime){const b=new Blob([data],{type:mime}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(){const lines=[['日期','類別','開始時間','結束時間','時長(分鐘)'],...db.records.slice().sort((a,b)=>a.start-b.start).map(r=>[ymd(r.start),t('away'),new Date(r.start).toLocaleString('sv-SE'),new Date(r.end).toLocaleString('sv-SE'),((r.end-r.start)/60000).toFixed(2)])];download('seat-tracker-'+ymd(Date.now())+'.csv','\ufeff'+lines.map(line=>line.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function restore(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(!v||!Array.isArray(v.records)||!v.records.every(valid)||!(v.active==null||validActive(v.active)))throw Error('format');if(!confirm(t('restoreConfirm')))return;db={records:v.records.map(r=>({...r,kind:'away'})),active:v.active?{...v.active,kind:'away'}:null};save();render();showToast(t('restoreSuccess'))}catch(e){alert(t('restoreError'))}finally{$('importFile').value=''}};reader.readAsText(file)}
$('startAway').onclick=start;$('stop').onclick=stop;$('language').onchange=e=>{lang=e.target.value;localStorage.setItem(LANG,lang);render()};$('month').value=ymd(Date.now()).slice(0,7);$('month').onchange=renderRows;$('exportCsv').onclick=csv;$('exportJson').onclick=()=>download('seat-tracker-backup-'+ymd(Date.now())+'.json',JSON.stringify(db,null,2),'application/json');$('importJson').onclick=()=>$('importFile').click();$('importFile').onchange=e=>restore(e.target.files[0]);render();setInterval(render,1000);
})();
</script></body></html>
